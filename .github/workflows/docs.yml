name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build documentation archive
        run: |
          xcodebuild docbuild \
            -scheme Ronalytic-Package \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .derived \
            OTHER_DOCC_FLAGS="--warnings-as-errors"

      - name: Convert to static HTML
        run: |
          ARCHIVE=$(find .derived -name "RonalyticCore.doccarchive" | head -n 1)
          echo "Archive: $ARCHIVE"
          xcrun docc process-archive transform-for-static-hosting "$ARCHIVE" \
            --hosting-base-path "${{ github.event.repository.name }}" \
            --output-path site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
