name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SWIFTLINT_VERSION: "0.65.1"
      SWIFTLINT_SHA256: "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned SwiftLint
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/portable_swiftlint.zip"
          INSTALL_DIR="$RUNNER_TEMP/swiftlint"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" \
            --output "$ARCHIVE"
          echo "$SWIFTLINT_SHA256  $ARCHIVE" | shasum -a 256 -c -
          mkdir -p "$INSTALL_DIR"
          unzip -q "$ARCHIVE" -d "$INSTALL_DIR"
          INSTALLED_VERSION=$("$INSTALL_DIR/swiftlint" version)
          if [[ "$INSTALLED_VERSION" != "$SWIFTLINT_VERSION" ]]; then
            echo "Unexpected SwiftLint version: $INSTALLED_VERSION" >&2
            exit 1
          fi
          echo "SwiftLint $INSTALLED_VERSION"
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Lint
        run: swiftlint --strict

  test:
    runs-on: macos-15
    env:
      COVERAGE_MIN: "90"
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Prepare iOS simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

          RUNTIME="com.apple.CoreSimulator.SimRuntime.iOS-18-5"
          DEVICE_TYPE="com.apple.CoreSimulator.SimDeviceType.iPhone-16"

          if ! xcrun simctl list runtimes -j | jq -e --arg runtime "$RUNTIME" \
            '.runtimes | any(.identifier == $runtime and .isAvailable == true)' > /dev/null; then
            xcodebuild -downloadPlatform iOS -buildVersion 18.5
          fi

          xcrun simctl list runtimes -j | jq -e --arg runtime "$RUNTIME" \
            '.runtimes | any(.identifier == $runtime and .isAvailable == true)' > /dev/null

          DEVICE_ID=$(xcrun simctl create "Ronalytic CI" "$DEVICE_TYPE" "$RUNTIME")
          echo "RONALYTIC_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build and test on iOS simulator
        run: |
          xcodebuild test \
            -scheme Ronalytic-Package \
            -destination "platform=iOS Simulator,id=$RONALYTIC_SIMULATOR_ID" \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            -clonedSourcePackagesDirPath .spm

      - name: Enforce coverage threshold
        run: |
          set -euo pipefail
          xcrun xccov view --report --json TestResults.xcresult > "$RUNNER_TEMP/coverage.json"
          COV=$(jq -er '
            [.targets[]
              | select(.name | endswith(".xctest") | not)
              | select(.name | contains("TestSupport") | not)]
            | (map(.coveredLines) | add) as $covered
            | (map(.executableLines) | add) as $total
            | if ($total | type) != "number" or $total <= 0 then
                error("No executable SDK lines found in coverage report")
              elif ($covered | type) != "number" or $covered < 0 or $covered > $total then
                error("Invalid covered line count")
              else
                $covered / $total * 100
              end' "$RUNNER_TEMP/coverage.json")
          echo "SDK line coverage: ${COV}% (minimum ${COVERAGE_MIN}%)"
          awk -v c="$COV" -v m="$COVERAGE_MIN" 'BEGIN { exit (c+0 < m+0) }'

      - name: Check public API baseline
        run: Scripts/api-dump.sh --check

      - name: Build documentation
        run: |
          xcodebuild docbuild \
            -scheme Ronalytic-Package \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath .spm \
            OTHER_DOCC_FLAGS="--warnings-as-errors"

      - name: Archive test result bundle
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          if [[ -d TestResults.xcresult ]]; then
            ditto -c -k --keepParent TestResults.xcresult "$RUNNER_TEMP/TestResults.xcresult.zip"
          else
            echo "No test result bundle was produced"
          fi

      - name: Upload test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-diagnostics
          path: |
            ${{ runner.temp }}/TestResults.xcresult.zip
            ${{ runner.temp }}/coverage.json
          if-no-files-found: warn
          retention-days: 14
